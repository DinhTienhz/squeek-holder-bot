name = "squeek-monitor"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "squeek-bot"
database_id = "90d20858-ef44-4c5a-8e73-c69d8a075185"

[triggers]
crons = ["*/5 * * * *"]

[vars]
BOT_HEALTH_URL = "https://squeek-bot.chainn.workers.dev/health"
ALERT_CHAT_ID = "940862656"

[observability]
enabled = true
