<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hamster Dust Runners</title>
<style>
  :root{--ink:#0b0b14;--gold:#ffd166;--lime:#b8f24d;--violet:#8b7bff;--muted:#9a9ab0}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#05050a;color:#eee;font-family:ui-monospace,Menlo,Consolas,monospace}
  body{display:grid;place-items:center;overflow:hidden;touch-action:manipulation}
  #wrap{position:relative;width:min(100vw,1200px);padding:8px}
  canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;background:#07070f;
    border:2px solid #1d1d2b;border-radius:6px;box-shadow:0 0 0 1px #000,0 18px 60px #000a}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="270" aria-label="Hamster Dust Runners"></canvas></div>

<script>
(() => {
'use strict';

const W = 480, H = 270;
const c = document.getElementById('c');
const ctx = c.getContext('2d');
ctx.imageSmoothingEnabled = false;

const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp = (a,b,t) => a + (b-a)*t;
const rnd = (a,b) => a + Math.random()*(b-a);
const saveKey = 'hamster_dust_runners_v1';

/* ---------------------------------- audio --------------------------------- */
const Sound = (() => {
  let ac = null, muted = false;
  const out = { get muted(){ return muted; }, toggle(){ muted = !muted; return muted; } };
  function ready(){
    if (!ac) { try { ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ ac = null; } }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, dur, type='square', vol=0.05, slide=0){
    if (muted || !ready()) return;
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq+slide), t+dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
  }
  function noise(dur=0.18, vol=0.04){
    if (muted || !ready()) return;
    const n = ac.sampleRate*dur, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
    f.type='bandpass'; f.frequency.value=900; f.Q.value=0.8;
    src.buffer = buf; g.gain.value = vol;
    src.connect(f).connect(g).connect(ac.destination); src.start();
  }
  out.squeak = () => tone(880 + Math.random()*120, 0.05, 'square', 0.025, 220);
  out.whoosh = () => noise(0.12, 0.02);
  out.coin = () => { tone(988,0.06,'square',0.045); setTimeout(()=>tone(1319,0.09,'square',0.04),55); };
  out.buy = () => { tone(523,0.06,'triangle',0.05); setTimeout(()=>tone(784,0.08,'triangle',0.05),60); };
  out.bad = () => tone(160,0.12,'sawtooth',0.04,-40);
  out.prestige = () => { [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.14,'square',0.05),i*90)); };
  return out;
})();

/* ---------------------------------- world --------------------------------- */
const ZONES = [
  { name:'Dusty Plains', short:'PLAINS', from:0,    mult:1,   ground:'#5b5f78', ground2:'#4a4e66', sky:['#101430','#1b2350'], dust:'#cfd6ff' },
  { name:'Crater Fields', short:'CRATERS', from:1800, mult:2.5, ground:'#6a5f78', ground2:'#564c66', sky:['#1a1230','#3a1f4d'], dust:'#ffd9f0' },
  { name:'Dark Side',     short:'DARKSIDE', from:4200, mult:6,  ground:'#3a3f58', ground2:'#2c3048', sky:['#07060f','#120f26'], dust:'#b8f24d' },
];
const DEPOTS = [70, 1900, 4300];
const ZONE_END = 6200;

const UPGRADES = [
  { key:'wheel',   name:'Wheel',    levels:['Wood','Steel','Mega','Rocket'],  base:60,  grow:2.3, desc:'run speed' },
  { key:'vac',     name:'Vacuum',   levels:['Straw','Hose','Industrial','Cyclone'], base:75, grow:2.4, desc:'pull radius' },
  { key:'suit',    name:'Suit',     levels:['Basic','Turbo','Mech','Starframe'], base:90, grow:2.6, desc:'sprint boost' },
  { key:'cap', name:'Storage',  levels:['Pouch','Backpack','Cart','Freight'], base:80, grow:2.2, desc:'dust capacity' },
];

function newState(){
  return {
    x: 120, vx: 0, dir: 1,
    coins: 0, dust: 0,
    capLvl: 0, wheelLvl: 0, vacLvl: 0, suitLvl: 0,
    helpers: 0, robots: 0, stars: 0,
    muted: Sound.muted,
    time: 0, day: 0,
    dusts: [], oldestDust: 0,
    squeakAt: 0, whooshAt: 0,
    shop: false, started: false, msg: '', msgAt: -9,
    zone: 0, best: Number(localStorage.getItem(saveKey+'_best')||0),
    deliveries: 0, totalDust: 0,
  };
}
let S = newState();

function loadSave(){
  try {
    const raw = localStorage.getItem(saveKey);
    if (!raw) return;
    const d = JSON.parse(raw);
    const num = (v, max) => Number.isFinite(+v) ? clamp(Math.floor(+v), 0, max) : 0;
    S.coins = num(d.coins, 1e12);
    S.stars = num(d.stars, 99);
    S.best = Math.max(num(d.best, 1e12), S.best);
    S.wheelLvl = num(d.wheel, 3);
    S.vacLvl = num(d.vac, 3);
    S.suitLvl = num(d.suit, 3);
    S.capLvl = num(d.cap, 3);
    S.helpers = num(d.helpers, MAX_HELPERS);
    S.robots = num(d.robots, MAX_ROBOTS);
  } catch(e){}
}

const MAX_HELPERS = 16, MAX_ROBOTS = 8;
loadSave();
const cap     = () => 40 + S.capLvl * 45;
const vacR    = () => 26 + S.vacLvl * 9 + S.helpers * 1.5;
const runSpd  = () => 46 + S.wheelLvl * 16 + S.helpers * 0.8;
const sprintX = () => 2.0 + S.suitLvl * 0.28;
const zoneOf  = (x) => x >= ZONES[2].from ? 2 : x >= ZONES[1].from ? 1 : 0;
const zone    = () => ZONES[zoneOf(S.x)];
const priceOf = (u) => Math.round(u.base * Math.pow(u.grow, S[u.key+'Lvl']));
const helperCost = () => Math.round(340 * Math.pow(1.55, S.helpers));
const robotCost  = () => Math.round(900 * Math.pow(1.65, S.robots));
const prestigeNeed = () => 250000;
const mult = () => 1 + S.stars * 0.25;

/* --------------------------------- sprites -------------------------------- */
const PAL = {
  fur:'#e8b06a', furD:'#b97f45', belly:'#ffe3b8', eye:'#1a1a22', helm:'#bfe9ff', helmD:'#6aa7c9',
  wheel:'#c9a06a', wheelD:'#8a6a42', accent:'#b8f24d',
};
const HAMSTER = [
  [
    '..hhhh..',
    '.hffffh.',
    'hfeffefh',
    'hffffffh',
    '.hffffh.',
    '..ffff..',
    '.f.ff.f.',
  ],
  [
    '..hhhh..',
    '.hffffh.',
    'hfeffefh',
    'hffffffh',
    '.hffffh.',
    '..ffff..',
    '..f..f..',
  ],
];
function sprite(map, x, y, px, pal){
  for (let r=0;r<map.length;r++){
    const row = map[r];
    for (let i=0;i<row.length;i++){
      const ch = row[i]; if (ch === '.') continue;
      ctx.fillStyle = pal[ch] || '#fff';
      ctx.fillRect(Math.round(x + i*px), Math.round(y + r*px), px, px);
    }
  }
}

/* -------------------------------- dust mgmt -------------------------------- */
function spawnDust(){
  const z = zoneOf(S.x + 240);
  const Z = ZONES[z];
  // Spawn inside the visible band (camera is player-centred), some behind.
  const x = clamp(S.x + rnd(-210, 235), 12, ZONE_END);
  if (x > ZONE_END) return;
  const night = S.day > 0.5;
  S.dusts.push({
    x, y: rnd(0,1) < 0.25 ? 150 + rnd(0,26) : 206 + rnd(-2,6),
    v: Math.round((1 + Math.random()*2) * Z.mult * (night ? 1.6 : 1)),
    tw: Math.random()*6.28,
  });
}
function ensureDust(){
  const want = 26;
  if (S.dusts.length < want) spawnDust();
}

/* --------------------------------- update --------------------------------- */
function update(dt){
  S.time += dt;
  S.day = (S.day + dt/95) % 1;

  // move
  const sprint = keys[' '] || keys['Space'] || touchSprint;
  const target = (keys.ArrowRight||keys.d||touchRight ? 1 : keys.ArrowLeft||keys.a||touchLeft ? -1 : 0)
    * runSpd() * (sprint ? sprintX() : 1);
  S.vx = lerp(S.vx, target, 1 - Math.pow(0.001, dt));
  S.x = clamp(S.x + S.vx*dt, 20, ZONE_END);
  if (Math.abs(S.vx) > 2) S.dir = S.vx > 0 ? 1 : -1;

  const z = zoneOf(S.x);
  if (z !== S.zone){ S.zone = z; flash(ZONES[z].name.toUpperCase()); }

  // sound while sprinting
  if (sprint && Math.abs(S.vx) > 20 && S.time > S.squeakAt){ Sound.squeak(); S.squeakAt = S.time + 0.30; }

  // vacuum
  const r = vacR(), full = S.dust >= cap();
  let pulling = false;
  for (let i=S.dusts.length-1;i>=0;i--){
    const d = S.dusts[i];
    d.tw += dt*3;
    const dx = d.x - S.x, dy = d.y - 200;
    const dist = Math.hypot(dx, d.y-208);
    if (!full && dist < r){
      pulling = true;
      d.x = lerp(d.x, S.x, 1-Math.pow(0.0015, dt));
      d.y = lerp(d.y, 208, 1-Math.pow(0.0015, dt));
      if (Math.abs(d.x-S.x) < 7){ S.dust = Math.min(cap(), S.dust + d.v); S.dusts.splice(i,1); S.totalDust += d.v; }
    } else if (d.x < S.x - 300){ S.dusts.splice(i,1); }
  }
  if (pulling && S.time > S.whooshAt){ Sound.whoosh(); S.whooshAt = S.time + 0.16; }

  // helpers + robots passive
  const passive = (S.helpers*0.25 + S.robots*1.4) * zone().mult * dt;
  if (passive > 0) S.dust = Math.min(cap(), S.dust + passive);

  ensureDust();

  // depot delivery
  for (const dx0 of DEPOTS){
    if (Math.abs(S.x - dx0) < 34 && S.dust >= 1){
      const gain = Math.round(S.dust * mult());
      S.coins += gain; S.deliveries++;
      flash('+' + gain + ' COINS');
      Sound.coin();
      S.dust = 0;
      break;
    }
  }

  // prestige availability note
  if (S.coins > S.best) { S.best = S.coins; localStorage.setItem(saveKey+'_best', String(Math.round(S.best))); }
}

/* --------------------------------- render --------------------------------- */
function px(v){ return Math.round(v); }

function drawSky(){
  const Z = zone();
  const g = ctx.createLinearGradient(0,0,0,H*0.72);
  g.addColorStop(0, Z.sky[0]); g.addColorStop(1, Z.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // stars (deterministic)
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  for (let i=0;i<70;i++){
    const sx = ((i*97 + 13) % W), sy = ((i*53 + 7) % 150);
    const tw = (Math.sin(S.time*2 + i)*0.5+0.5);
    if (tw > 0.25) ctx.fillRect(sx, sy, 1, 1);
  }
  // earth
  const ex = 396, ey = 46;
  ctx.fillStyle = '#3f7fd0'; ctx.beginPath(); ctx.arc(ex,ey,15,0,7); ctx.fill();
  ctx.fillStyle = '#6fb06a'; ctx.fillRect(ex-8,ey-6,5,4); ctx.fillRect(ex+1,ey+3,7,4); ctx.fillRect(ex-4,ey+7,4,3);
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(ex-4,ey-4,6,0,7); ctx.fill();
  // day/night tint
  const night = Math.max(0, Math.sin(S.day*Math.PI*2 - Math.PI/2));
  if (night < 0.5) { ctx.fillStyle = `rgba(90,130,200,${0.10*(1-night*2)})`; ctx.fillRect(0,0,W,H*0.75); }
  ctx.fillStyle = `rgba(4,6,20,${0.46*night})`; ctx.fillRect(0,0,W,H*0.75);
}

function drawGround(){
  const Z = zone();
  const gy = 214;
  const off = px(S.x) % 24;
  ctx.fillStyle = Z.ground; ctx.fillRect(0, gy, W, H-gy);
  ctx.fillStyle = Z.ground2;
  for (let x=-off; x<W+24; x+=24){ ctx.fillRect(x, gy+6, 12, 3); ctx.fillRect(x+8, gy+16, 9, 2); }
  // speckles
  for (let i=0;i<40;i++){
    const sx = ((i*71 - S.x*0.6) % (W+40) + W+40) % (W+40) - 20;
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.fillRect(px(sx), gy+4+((i*13)%20), 2, 2);
  }
  // craters in crater zone
  if (S.zone >= 1){
    for (let i=0;i<6;i++){
      const cx = ((i*173 - S.x*0.9) % (W+120) + W+120) % (W+120) - 60;
      ctx.fillStyle = 'rgba(0,0,0,.22)';
      ctx.beginPath(); ctx.ellipse(cx, gy+26, 22, 6, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.08)';
      ctx.beginPath(); ctx.ellipse(cx-3, gy+24, 14, 3, 0, 0, 7); ctx.fill();
    }
  }
}

function drawDepot(){
  for (const dx0 of DEPOTS){
    const sx = px(dx0 - S.x + W*0.5);
    if (sx < -80 || sx > W+80) continue;
    const y = 214;
    // base
    ctx.fillStyle = '#262a3d'; ctx.fillRect(sx-26, y-30, 52, 30);
    ctx.fillStyle = '#343a55'; ctx.fillRect(sx-26, y-30, 52, 6);
    // dome
    ctx.fillStyle = '#9fd7ff'; ctx.beginPath(); ctx.arc(sx, y-30, 14, Math.PI, 0); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(sx-4, y-34, 6, Math.PI, 0); ctx.fill();
    // door + light
    ctx.fillStyle = '#0d0f18'; ctx.fillRect(sx-6, y-16, 12, 16);
    ctx.fillStyle = (Math.sin(S.time*3)>0) ? '#b8f24d' : '#3f5d20';
    ctx.fillRect(sx+16, y-26, 3, 3);
    // sign
    ctx.fillStyle = '#ffd166'; ctx.fillRect(sx-3, y-52, 6, 8);
  }
}

function drawDust(){
  for (const d of S.dusts){
    const sx = px(d.x - S.x + W*0.5);
    if (sx < -12 || sx > W+12) continue;
    const tw = 0.65 + 0.35*Math.sin(d.tw);
    const col = zone().dust;
    ctx.globalAlpha = 0.22 * tw;
    ctx.fillStyle = col;
    ctx.fillRect(sx-3, px(d.y)-3, 8, 8);
    ctx.globalAlpha = tw;
    const bob = Math.round(Math.sin(d.tw*1.7)*1.5);
    ctx.fillStyle = col;
    ctx.fillRect(sx, px(d.y)+bob, 2, 3);
    ctx.fillRect(sx-2, px(d.y)+1+bob, 6, 1);
    ctx.fillRect(sx-1, px(d.y)-1+bob, 4, 5);
    ctx.globalAlpha = 1;
  }
}

function drawWheel(){
  const cx = px(W*0.5), cy = 196;
  const speedAbs = Math.abs(S.vx);
  const rot = S.time * (2 + speedAbs*0.05) * (S.vx < 0 ? -1 : 1);
  const R = 30;

  // ring (pixel circle)
  for (let a=0;a<64;a++){
    const ang = a/64*Math.PI*2;
    const x = cx + Math.cos(ang)*R, y = cy + Math.sin(ang)*R;
    ctx.fillStyle = (a%8===0) ? PAL.wheelD : PAL.wheel;
    ctx.fillRect(px(x)-1, px(y)-1, 3, 3);
  }
  // spokes
  for (let s=0;s<6;s++){
    const ang = rot + s*Math.PI/3;
    for (let t=8;t<R-2;t+=3){
      ctx.fillStyle = '#6f5636';
      ctx.fillRect(px(cx+Math.cos(ang)*t), px(cy+Math.sin(ang)*t), 2, 2);
    }
  }
  // hub
  ctx.fillStyle = '#8a6a42'; ctx.fillRect(cx-3, cy-3, 6, 6);

  // hamster inside (bobs with run)
  const bob = Math.round(Math.sin(S.time*(10+speedAbs*0.2))*1);
  const frame = Math.floor(S.time*10) % 2;
  sprite(HAMSTER[frame], cx-16, cy-14+bob, 4, { h:PAL.helm, f:PAL.fur, e:PAL.eye });
  // helmet shine
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(cx-10, cy-13+bob, 2, 1);

  // ground shadow
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(cx, 216, 34, 7, 0, 0, 7); ctx.fill();
}

function drawHUD(){
  ctx.fillStyle = 'rgba(8,8,16,.72)'; ctx.fillRect(0,0,W,22);
  ctx.font = '8px ui-monospace,monospace'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#ffd166'; ctx.fillText('◈ ' + fmt(S.coins), 8, 7);
  ctx.fillStyle = '#cfd6ff'; ctx.fillText('DUST ' + Math.floor(S.dust) + '/' + cap(), 92, 7);
  // bar
  const bw = 70, p = clamp(S.dust/cap(),0,1);
  ctx.fillStyle = '#22243a'; ctx.fillRect(178, 8, bw, 6);
  ctx.fillStyle = '#b8f24d'; ctx.fillRect(178, 8, Math.round(bw*p), 6);

  const Z = zone();
  ctx.fillStyle = '#9a9ab0'; ctx.fillText(Z.short, 300, 7);
  // clock
  const night = S.day > 0.5;
  ctx.fillStyle = night ? '#8b7bff' : '#ffd166';
  ctx.fillText(night ? '☾ NIGHT' : '☀ DAY', 380, 7);

  // bottom hint / message
  ctx.fillStyle = 'rgba(8,8,16,.78)'; ctx.fillRect(0,H-16,W,16);
  if (S.msg && S.time - S.msgAt < 1.8){
    ctx.fillStyle = 'rgba(184,242,77,' + (1 - (S.time-S.msgAt)/1.8) + ')';
    ctx.fillText(S.msg, 8, H-12);
  } else {
    ctx.fillStyle = 'rgba(196,196,214,.95)';
    ctx.fillText('ARROWS move · SPACE sprint+vacuum · B shop · depot = sell', 8, H-11);
  }

  // shop
  if (S.shop) drawShop();
}

function drawShop(){
  const x0 = 54, y0 = 40, w = W - 108, h = 176;
  ctx.fillStyle = 'rgba(5,5,12,.94)'; ctx.fillRect(x0, y0, w, h);
  ctx.strokeStyle = '#2b2b40'; ctx.strokeRect(x0+0.5, y0+0.5, w-1, h-1);
  ctx.fillStyle = '#b8f24d';
  ctx.fillText('SHOP', x0+12, y0+10);
  ctx.fillStyle = '#6f6f86';
  ctx.fillText('1-4 upgrade · 5 helper · 6 robot · P prestige · B close', x0+52, y0+10);

  let y = y0 + 28;
  for (let i=0;i<UPGRADES.length;i++){
    const u = UPGRADES[i], lvl = S[u.key+'Lvl'], max = u.levels.length-1;
    const price = priceOf(u);
    const can = S.coins >= price && lvl < max;
    ctx.fillStyle = can ? '#e8e8f2' : '#6b6b80';
    ctx.fillText((i+1)+'.', x0+12, y);
    ctx.fillText(u.name, x0+28, y);
    ctx.fillStyle = lvl >= max ? '#b8f24d' : (can ? '#cfd6ff' : '#6b6b80');
    ctx.fillText(u.levels[lvl] + (lvl>=max ? ' (MAX)' : ''), x0+96, y);
    ctx.fillStyle = can ? '#ffd166' : '#6b6b80';
    ctx.fillText(lvl >= max ? '—' : price + 'c', x0+206, y);
    ctx.fillStyle = '#6f6f86'; ctx.fillText(u.desc, x0+258, y);
    y += 15;
  }

  y += 4;
  ctx.fillStyle = S.helpers<MAX_HELPERS && S.coins>=helperCost() ? '#e8e8f2' : '#6b6b80';
  ctx.fillText('5.', x0+12, y); ctx.fillText('Helper ' + S.helpers + '/' + MAX_HELPERS, x0+28, y);
  ctx.fillStyle = '#6f6f86'; ctx.fillText('+vacuum, +speed', x0+120, y);
  ctx.fillStyle = S.helpers<MAX_HELPERS ? (S.coins>=helperCost()?'#ffd166':'#6b6b80') : '#b8f24d';
  ctx.fillText(S.helpers<MAX_HELPERS ? helperCost()+'c' : 'MAX', x0+206, y);
  y += 15;

  ctx.fillStyle = S.robots<MAX_ROBOTS && S.coins>=robotCost() ? '#e8e8f2' : '#6b6b80';
  ctx.fillText('6.', x0+12, y); ctx.fillText('Robot ' + S.robots + '/' + MAX_ROBOTS, x0+28, y);
  ctx.fillStyle = '#6f6f86'; ctx.fillText('+passive dust', x0+120, y);
  ctx.fillStyle = S.robots<MAX_ROBOTS ? (S.coins>=robotCost()?'#ffd166':'#6b6b80') : '#b8f24d';
  ctx.fillText(S.robots<MAX_ROBOTS ? robotCost()+'c' : 'MAX', x0+206, y);
  y += 18;

  const canP = S.coins >= prestigeNeed();
  ctx.fillStyle = canP ? '#ffd166' : '#6b6b80';
  ctx.fillText('P. Reset the wheel', x0+12, y);
  ctx.fillStyle = '#6f6f86'; ctx.fillText('+25% coins forever · needs ' + fmt(prestigeNeed()) + ' coins', x0+136, y);
  y += 14;
  if (S.stars) { ctx.fillStyle = '#8b7bff'; ctx.fillText('★ ' + S.stars + ' star' + (S.stars>1?'s':'') + '  →  ×' + mult().toFixed(2) + ' coin value', x0+12, y); }
}

function fmt(n){
  n = Math.floor(n);
  if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
  if (n >= 1e4) return Math.round(n/1e3) + 'k';
  return String(n);
}
function flash(t){ S.msg = t; S.msgAt = S.time; }

function render(){
  drawSky();
  drawGround();
  drawDepot();
  drawDust();
  drawWheel();
  drawHUD();
}

/* --------------------------------- input ---------------------------------- */
const keys = Object.create(null);
let touchLeft=false, touchRight=false, touchSprint=false;

addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  keys[e.key] = true; keys[e.key.toLowerCase()] = true;
  if (e.key === 'b' || e.key === 'B') { S.shop = !S.shop; Sound.buy(); }
  if (e.key === 'm' || e.key === 'M') { flash(Sound.toggle() ? 'MUTED' : 'SOUND ON'); }
  if (S.shop){
    const buyMap = { '1':0, '2':1, '3':2, '4':3 };
    if (e.key in buyMap) buy(buyMap[e.key]);
    if (e.key === '5') buyHelper();
    if (e.key === '6') buyRobot();
    if (e.key === 'p' || e.key === 'P') prestige();
  }
  if (!S.started) start();
}, { passive:false });

addEventListener('keyup', e => { keys[e.key] = false; keys[e.key.toLowerCase()] = false; });

function canvasPos(e){
  const r = c.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
}
c.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!S.started) start();
  const p = canvasPos(e);
  if (p.x < 0.2) touchLeft = true;
  else if (p.x > 0.8) touchRight = true;
  else touchSprint = true;
  c.setPointerCapture(e.pointerId);
});
c.addEventListener('pointerup', e => { touchLeft = touchRight = touchSprint = false; });
c.addEventListener('pointercancel', () => { touchLeft = touchRight = touchSprint = false; });

/* --------------------------------- shop ----------------------------------- */
function buy(i){
  const u = UPGRADES[i], lvl = S[u.key+'Lvl'];
  if (lvl >= u.levels.length-1) return;
  const price = priceOf(u);
  if (S.coins < price) { Sound.bad(); flash('NOT ENOUGH COINS'); return; }
  S.coins -= price; S[u.key+'Lvl']++;
  Sound.buy(); flash(u.name.toUpperCase() + ' → ' + u.levels[lvl+1]);
}
function buyHelper(){
  if (S.helpers >= MAX_HELPERS) return;
  const price = helperCost();
  if (S.coins < price) { Sound.bad(); flash('NOT ENOUGH COINS'); return; }
  S.coins -= price; S.helpers++; Sound.buy(); flash('HELPER #' + S.helpers);
}
function buyRobot(){
  if (S.robots >= MAX_ROBOTS) return;
  const price = robotCost();
  if (S.coins < price) { Sound.bad(); flash('NOT ENOUGH COINS'); return; }
  S.coins -= price; S.robots++; Sound.buy(); flash('ROBOT #' + S.robots);
}
function prestige(){
  if (S.coins < prestigeNeed()) { Sound.bad(); flash('NEED ' + fmt(prestigeNeed()) + ' COINS'); return; }
  const stars = S.stars + 1;
  const best = S.best;
  S = newState(); S.stars = stars; S.best = best; S.started = true;
  Sound.prestige(); flash('WHEEL RESET · STAR ' + stars);
}

/* --------------------------------- loop ----------------------------------- */
let last = performance.now(), acc = 0;
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000);
  last = now;
  if (S.started && !S.shop) update(dt);
  render();
  if (!S.started) drawTitle();
  requestAnimationFrame(frame);
}

function drawTitle(){
  ctx.fillStyle = 'rgba(5,5,12,.78)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#b8f24d'; ctx.font = 'bold 20px ui-monospace,monospace';
  ctx.fillText('HAMSTER DUST RUNNERS', W/2, 92);
  ctx.fillStyle = '#e8e8f2'; ctx.font = '9px ui-monospace,monospace';
  ctx.fillText('One small spin for hamster, one giant clean for the Moon.', W/2, 112);
  ctx.fillStyle = '#9a9ab0';
  ctx.fillText('ARROWS / A D to move · hold SPACE to sprint & vacuum', W/2, 142);
  ctx.fillText('Drive to a depot to sell dust. Upgrades make you faster.', W/2, 156);
  ctx.fillStyle = (Math.sin(S.time*4)>0) ? '#ffd166' : '#8a6a2a';
  ctx.fillText('PRESS SPACE / TAP TO START', W/2, 190);
  ctx.textAlign = 'left';
}

function start(){
  S.started = true;
  flash('GO!');
  Sound.buy();
}

/* ------------------------------- persistence ------------------------------- */
function persist(){
  try {
    localStorage.setItem(saveKey, JSON.stringify({
      coins:S.coins, stars:S.stars, best:S.best,
      wheel:S.wheelLvl, vac:S.vacLvl, suit:S.suitLvl, cap:S.capLvl,
      helpers:S.helpers, robots:S.robots,
    }));
  } catch(e){}
}
setInterval(persist, 4000);

/* debug hook for automated checks (read-only state + explicit actions) */
window.__hdr = {
  state: () => ({ ...S, dusts: S.dusts.length }),
  buy, buyHelper, buyRobot, prestige, start,
  addCoins: (n) => { S.coins += n; },
};

requestAnimationFrame(frame);
})();
</script>
</body>
</html>
