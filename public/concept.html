<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hamster Dust Runners — 3D concept</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%)}
  .grain{position:fixed;inset:0;pointer-events:none;opacity:.10;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.55'/></svg>")}

  .hud{position:fixed;left:42px;top:38px;color:#dff9ff;pointer-events:none;
    text-shadow:0 0 12px rgba(90,230,255,.55)}
  .hud .row{display:flex;align-items:center;gap:12px}
  .hud .label{font-size:11px;letter-spacing:.28em;color:#8fe6ff;opacity:.85}
  .meter{margin-top:9px;width:230px;height:8px;border:1px solid rgba(120,240,255,.45);
    background:rgba(10,40,50,.45);border-radius:2px;overflow:hidden}
  .meter i{display:block;height:100%;width:78%;
    background:linear-gradient(90deg,#39f0d0,#9ff6ff);box-shadow:0 0 14px #39f0d0}
  .hud .sub{margin-top:8px;font-size:10px;letter-spacing:.16em;color:#a9d9e6;opacity:.7}
  .wheel-icon{margin-top:14px;width:44px;height:44px;opacity:.9}
  .wheel-icon svg{animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .coins{position:fixed;right:46px;top:44px;text-align:right;color:#ffe4a3;
    text-shadow:0 0 18px rgba(255,190,80,.45);pointer-events:none}
  .coins .num{font-size:26px;letter-spacing:.06em}
  .coins .cap{font-size:10px;letter-spacing:.3em;color:#ffcf78;opacity:.7;margin-top:4px}

  .tag{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);text-align:center;
    color:#eaf6ff;pointer-events:none;padding:14px 34px 12px;border-radius:10px;
    background:radial-gradient(120% 160% at 50% 60%, rgba(2,6,14,.72), rgba(2,6,14,.28) 70%, rgba(2,6,14,0) 100%)}
  .tag .line{font-size:22px;letter-spacing:.42em;text-transform:uppercase;opacity:.92;
    text-shadow:0 0 26px rgba(120,220,255,.35), 0 2px 18px rgba(0,0,0,.8)}
  .tag .hint{margin-top:10px;font-size:9px;letter-spacing:.34em;color:#8fd6e6;opacity:.55}

  .brand{position:fixed;left:42px;bottom:40px;color:#cfe9f5;pointer-events:none;opacity:.85}
  .brand .t{font-size:11px;letter-spacing:.34em}
  .brand .s{margin-top:6px;font-size:9px;letter-spacing:.22em;color:#7fb7c6;opacity:.7}
  .loading{position:fixed;inset:0;display:grid;place-items:center;background:#000;color:#7fe6ff;
    font-size:11px;letter-spacing:.3em;transition:opacity .4s}
</style>
</head>
<body>
<script>
window.__errs=[];
window.addEventListener('error', e=>{ window.__errs.push((e.message||'')+' @'+(e.filename||'')); document.title='ERR '+e.message; });
window.addEventListener('unhandledrejection', e=>{ window.__errs.push('promise: '+(e.reason&&e.reason.message||e.reason)); document.title='ERR promise'; });
</script>

<div class="vignette"></div>
<div class="grain"></div>

<div class="hud">
  <div class="row"><span class="label">SUIT HUD</span></div>
  <div class="meter"><i></i></div>
  <div class="sub">DUST LOAD 78% · VACUUM NOMINAL</div>
  <div class="wheel-icon">
    <svg viewBox="0 0 44 44" width="44" height="44" fill="none" stroke="#63efff" stroke-width="1.6">
      <circle cx="22" cy="22" r="17" opacity=".55"/>
      <circle cx="22" cy="22" r="3"/>
      <g opacity=".9">
        <path d="M22 5v10M22 29v10M5 22h10M29 22h10M10 10l7 7M27 27l7 7M34 10l-7 7M17 27l-7 7"/>
      </g>
    </svg>
  </div>
</div>

<div class="coins"><div class="num">+1,284</div><div class="cap">LUNAR COINS</div></div>

<div class="tag">
  <div class="line">One spin at a time.</div>
  <div class="hint">HAMSTER DUST RUNNERS · CONCEPT ART</div>
</div>

<div class="brand"><div class="t">HAMSTER DUST RUNNERS</div><div class="s">LUNAR SANITATION DIVISION · SECTOR 7</div></div>

<div class="loading" id="loading">COMPILING LUNAR SURFACE…</div>

<script type="importmap">
{ "imports": { "three": "./three/three.module.js" } }

<script type="module">
import * as THREE from 'three';

const params = new URLSearchParams(location.search);
const VIEW = params.get('view') || 'hero';

/* ------------------------------- renderer ------------------------------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
} catch(e) {
  document.getElementById('loading').textContent = 'WEBGL UNAVAILABLE — open on a GPU browser';
  throw e;
}
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.98;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060d);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 900);

/* -------------------------------- helpers ------------------------------- */
function canvasTex(w, h, draw, repeat){
  const cn = document.createElement('canvas'); cn.width=w; cn.height=h;
  const g = cn.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(cn);
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeat){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repeat[0],repeat[1]); }
  t.anisotropy = 8;
  return t;
}
const rnd = (a,b)=>a+Math.random()*(b-a);

/* ------------------------------ moon ground ----------------------------- */
const moonTex = canvasTex(1024,1024,(g,w,h)=>{
  g.fillStyle='#cfccc4'; g.fillRect(0,0,w,h);
  // broad mottling
  for(let i=0;i<260;i++){
    const x=rnd(0,w), y=rnd(0,h), r=rnd(20,120);
    g.fillStyle = `rgba(${Math.random()<.5?70:255},${Math.random()<.5?70:255},${235},${rnd(.01,.035)})`;
    g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  // regolith speckles
  for(let i=0;i<26000;i++){
    const x=rnd(0,w), y=rnd(0,h), s=Math.random()<.9?1:2;
    const v = Math.random()<.5 ? 150 : 245;
    g.fillStyle=`rgba(${v},${v},${v-6},${rnd(.05,.22)})`;
    g.fillRect(x,y,s,s);
  }
  // small craters
  for(let i=0;i<90;i++){
    const x=rnd(0,w), y=rnd(0,h), r=rnd(3,14);
    g.fillStyle='rgba(90,88,86,.30)'; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
    g.fillStyle='rgba(255,255,255,.22)'; g.beginPath(); g.arc(x-r*.2,y-r*.2,r*.75,0,7); g.fill();
    g.fillStyle='rgba(120,118,116,.18)'; g.beginPath(); g.arc(x,y,r*.55,0,7); g.fill();
  }
},[26,26]);

const groundMat = new THREE.MeshStandardMaterial({ map:moonTex, color:0xb9b6ae, roughness:.98, metalness:0, bumpMap:moonTex, bumpScale:.35 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(520,520,1,1), groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

/* clean swept path: bright ribbon with soft edges, from the vehicle back */
const pathTex = canvasTex(256,1024,(g,w,h)=>{
  const grd = g.createLinearGradient(0,0,w,0);
  grd.addColorStop(0,'rgba(255,255,255,0)');
  grd.addColorStop(.18,'rgba(255,255,255,.85)');
  grd.addColorStop(.5,'rgba(255,255,255,1)');
  grd.addColorStop(.82,'rgba(255,255,255,.85)');
  grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){
    const x=rnd(0,w), y=rnd(0,h);
    g.fillStyle=`rgba(${200+Math.random()*55},${200+Math.random()*55},255,${rnd(.02,.08)})`;
    g.fillRect(x,y,rnd(1,4),rnd(6,34));
  }
});
pathTex.wrapS = pathTex.wrapT = THREE.ClampToEdgeWrapping;
const pathMat = new THREE.MeshStandardMaterial({
  map:pathTex, transparent:true, color:0xf6f6f8, roughness:.85, metalness:0,
  depthWrite:false, polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2
});
const path = new THREE.Mesh(new THREE.PlaneGeometry(7.2, 140), pathMat);
path.rotation.x = -Math.PI/2;
path.rotation.z = 0.02;
path.position.set(0, 0.012, -66);
path.receiveShadow = false;
scene.add(path);

/* ------------------------------- craters -------------------------------- */
const craterMat = new THREE.MeshStandardMaterial({ color:0xa8a49c, roughness:1 });
const rimMat = new THREE.MeshStandardMaterial({ color:0xd9d6cf, roughness:.95 });
function crater(x,z,r){
  const g = new THREE.Group();
  const bowl = new THREE.Mesh(new THREE.CircleGeometry(r, 40), craterMat);
  bowl.rotation.x = -Math.PI/2; bowl.position.y = 0.01;
  const rim = new THREE.Mesh(new THREE.TorusGeometry(r, r*0.07, 8, 44), rimMat);
  rim.rotation.x = -Math.PI/2; rim.position.y = 0.03;
  g.add(bowl, rim); g.position.set(x,0,z);
  scene.add(g);
}
for(let i=0;i<26;i++){
  const a = Math.random()*Math.PI*2, d = rnd(14,120);
  const x = Math.cos(a)*d, z = Math.sin(a)*d - 20;
  if (Math.abs(x) < 8 && z > -60) continue;
  crater(x, z, rnd(1.2, 5));
}

/* --------------------------------- rocks -------------------------------- */
const rockMat = new THREE.MeshStandardMaterial({ color:0x9d9992, roughness:1, flatShading:true });
for(let i=0;i<70;i++){
  const a=Math.random()*Math.PI*2, d=rnd(10,140);
  const x=Math.cos(a)*d, z=Math.sin(a)*d-30;
  if(Math.abs(x)<7 && z>-70) continue;
  const s=rnd(.25,1.6);
  const geo=new THREE.IcosahedronGeometry(s,1);
  const vp=geo.attributes.position;
  for(let k=0;k<vp.count;k++){
    const f=0.72+Math.random()*0.55;
    vp.setXYZ(k, vp.getX(k)*f, vp.getY(k)*f*0.9, vp.getZ(k)*f);
  }
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo, rockMat);
  m.position.set(x, s*0.35, z);
  m.rotation.set(rnd(0,3),rnd(0,3),rnd(0,3));
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
}

/* ------------------------------- mountains ------------------------------ */
const mtnMat = new THREE.MeshStandardMaterial({ color:0x8e8b86, roughness:1, flatShading:true });
for(let i=0;i<14;i++){
  const a = -Math.PI*0.5 + rnd(-1.1,1.1);
  const d = rnd(150,240);
  const h = rnd(18,46);
  const m = new THREE.Mesh(new THREE.ConeGeometry(rnd(22,46), h, 6, 1), mtnMat);
  m.position.set(Math.cos(a)*d, h/2-2, Math.sin(a)*d - 30);
  m.rotation.y = rnd(0,3);
  scene.add(m);
}

/* -------------------------------- depot --------------------------------- */
const depot = new THREE.Group();
depot.position.set(-26, 0, -78);
const white = new THREE.MeshStandardMaterial({ color:0xe8ebef, roughness:.55, metalness:.05 });
const glass = new THREE.MeshStandardMaterial({ color:0x9fe8ff, emissive:0x2ad8ff, emissiveIntensity:.9, roughness:.25 });
const dark = new THREE.MeshStandardMaterial({ color:0x3a3f4a, roughness:.7, metalness:.3 });

const base = new THREE.Mesh(new THREE.BoxGeometry(26,1.2,18), white);
base.position.y=0.6; base.castShadow=base.receiveShadow=true; depot.add(base);

const dome = new THREE.Mesh(new THREE.SphereGeometry(9,32,20,0,Math.PI*2,0,Math.PI/2), white);
dome.position.set(-5,1.2,0); dome.castShadow=dome.receiveShadow=true; depot.add(dome);
for(let i=0;i<6;i++){
  const win = new THREE.Mesh(new THREE.BoxGeometry(3.6,.8,.2), glass);
  const a = -0.9 + i*0.36;
  win.position.set(-5+Math.sin(a)*8.2, 4.6, Math.cos(a)*8.2);
  win.rotation.y = a;
  depot.add(win);
}
const tower = new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.6,14,16), white);
tower.position.set(7,7,0); tower.castShadow=tower.receiveShadow=true; depot.add(tower);
const towerTop = new THREE.Mesh(new THREE.CylinderGeometry(3.1,3.1,.7,16), white);
towerTop.position.set(7,14.3,0); depot.add(towerTop);
const ring = new THREE.Mesh(new THREE.TorusGeometry(2.4,.12,8,32), glass);
ring.rotation.x=Math.PI/2; ring.position.set(7,10.6,0); depot.add(ring);
const mast = new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,7,6), dark);
mast.position.set(7,17.6,0); depot.add(mast);
const beacon = new THREE.Mesh(new THREE.SphereGeometry(.28,10,8), new THREE.MeshStandardMaterial({color:0xff5a4a, emissive:0xff2a1a, emissiveIntensity:2}));
beacon.position.set(7,21.1,0); depot.add(beacon);

const pad = new THREE.Mesh(new THREE.CylinderGeometry(7,7,.18,40), new THREE.MeshStandardMaterial({color:0xb9bcc2, roughness:.8}));
pad.position.set(13,0.1,4); pad.receiveShadow=true; depot.add(pad);
for(let i=0;i<8;i++){
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(1.1,.06,2.2), new THREE.MeshStandardMaterial({color:0xffb347, emissive:0xff8a00, emissiveIntensity:.15}));
  const a=i/8*Math.PI*2;
  stripe.position.set(13+Math.cos(a)*5.4,0.21,4+Math.sin(a)*5.4);
  stripe.rotation.y=-a; depot.add(stripe);
}
scene.add(depot);

/* -------------------------------- Earth --------------------------------- */
const earthTex = canvasTex(1024,512,(g,w,h)=>{
  const grd = g.createLinearGradient(0,0,0,h);
  grd.addColorStop(0,'#1b4d8f'); grd.addColorStop(.5,'#2f7fc4'); grd.addColorStop(1,'#163f74');
  g.fillStyle=grd; g.fillRect(0,0,w,h);
  for(let i=0;i<26;i++){
    const x=rnd(0,w), y=rnd(60,h-60), r=rnd(24,90);
    g.fillStyle='rgba(74,140,86,'+rnd(.55,.9)+')';
    g.beginPath(); g.ellipse(x,y,r,r*rnd(.4,.8),rnd(0,3),0,7); g.fill();
    g.fillStyle='rgba(150,190,120,.35)';
    g.beginPath(); g.ellipse(x-r*.25,y-r*.2,r*.5,r*.3,rnd(0,3),0,7); g.fill();
  }
  for(let i=0;i<70;i++){
    const x=rnd(0,w), y=rnd(0,h), ww=rnd(40,160), hh=rnd(6,20);
    g.fillStyle='rgba(255,255,255,'+rnd(.05,.18)+')';
    g.beginPath(); g.ellipse(x,y,ww,hh,rnd(-.3,.3),0,7); g.fill();
  }
});
const earth = new THREE.Mesh(new THREE.SphereGeometry(22, 64, 40),
  new THREE.MeshStandardMaterial({ map:earthTex, roughness:.9, metalness:0, emissive:0x123a72, emissiveIntensity:.45 }));
earth.position.set(23, 31, -148);
scene.add(earth);
const halo = new THREE.Mesh(new THREE.SphereGeometry(23.1, 32, 24),
  new THREE.MeshBasicMaterial({ color:0x86c8ff, transparent:true, opacity:.10, side:THREE.BackSide }));
halo.position.copy(earth.position); scene.add(halo);

/* -------------------------------- stars --------------------------------- */
const starGeo = new THREE.BufferGeometry();
const N=2600, pos=new Float32Array(N*3), col=new Float32Array(N*3);
for(let i=0;i<N;i++){
  const v = new THREE.Vector3().randomDirection().multiplyScalar(300);
  pos[i*3]=v.x; pos[i*3+1]=v.y; pos[i*3+2]=v.z;
  const c = 0.75 + Math.random()*0.25;
  col[i*3]=c; col[i*3+1]=c; col[i*3+2]=1;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
starGeo.setAttribute('color', new THREE.BufferAttribute(col,3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ size:.75, vertexColors:true, transparent:true, opacity:.95, sizeAttenuation:true }));
scene.add(stars);

/* -------------------------------- lights -------------------------------- */
const sun = new THREE.DirectionalLight(0xfff4e2, 2.9);
sun.position.set(46, 26, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-45; sun.shadow.camera.right=45;
sun.shadow.camera.top=45; sun.shadow.camera.bottom=-45;
sun.shadow.camera.near=1; sun.shadow.camera.far=160;
sun.shadow.bias = -0.0004;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x9dc4ff, 0x5b5850, .55));
const earthShine = new THREE.DirectionalLight(0x7fb4ff, .55);
// soft fill so the face is not lost inside the wheel
const faceFill = new THREE.PointLight(0xffeedd, 14, 9, 2);
faceFill.position.set(0, 3.3, 4.2);
scene.add(faceFill);
const rim = new THREE.DirectionalLight(0x9fd4ff, 1.15);
rim.position.set(-38, 26, -46);
scene.add(rim);
const hubLight = new THREE.PointLight(0x6fe9ff, 6, 7, 2);
hubLight.position.set(0, 2.45, 0);
scene.add(hubLight);
earthShine.position.set(70, 40, -120);
scene.add(earthShine);

/* ------------------------------- hamster -------------------------------- */
// fabric + metal wear maps so the suit and frame are not plastic-clean
const fabricRough = canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#9a9a9a'; g.fillRect(0,0,w,h);
  for(let i=0;i<9000;i++){
    const v=120+Math.random()*70;
    g.fillStyle=`rgba(${v},${v},${v},.35)`;
    g.fillRect(Math.random()*w, Math.random()*h, 1, Math.random()<.2?2:1);
  }
},[3,3]);
const metalRough = canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#6f6f6f'; g.fillRect(0,0,w,h);
  for(let i=0;i<260;i++){ // scratches
    g.strokeStyle=`rgba(${180+Math.random()*60},${180+Math.random()*60},${190+Math.random()*60},${.15+Math.random()*.35})`;
    g.lineWidth=Math.random()<.8?1:2;
    const x=Math.random()*w, y=Math.random()*h, a=Math.random()*Math.PI;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*(10+Math.random()*90), y+Math.sin(a)*(4+Math.random()*30)); g.stroke();
  }
  for(let i=0;i<70;i++){ // grime blotches
    g.fillStyle=`rgba(40,40,45,${.05+Math.random()*.12})`;
    g.beginPath(); g.arc(Math.random()*w, Math.random()*h, 3+Math.random()*22, 0, 7); g.fill();
  }
},[2,2]);

const suitMat = new THREE.MeshPhysicalMaterial({ color:0xf7f8fa, roughness:.62, metalness:.02,
  roughnessMap:fabricRough, sheen:.6, sheenRoughness:.7, sheenColor:0xdfe8ff });
const accentMat = new THREE.MeshStandardMaterial({ color:0xff9b2f, emissive:0xff7a00, emissiveIntensity:.12, roughness:.45 });
const furMap = canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#e8b06a'; g.fillRect(0,0,w,h);
  for(let i=0;i<240;i++){
    g.fillStyle = Math.random()<.55 ? `rgba(196,138,78,${rnd(.05,.16)})` : `rgba(255,220,170,${rnd(.05,.18)})`;
    g.beginPath(); g.ellipse(Math.random()*w, Math.random()*h, rnd(8,40), rnd(5,22), rnd(0,3),0,7); g.fill();
  }
  for(let i=0;i<5000;i++){
    const v=Math.random()<.5?150:250;
    g.fillStyle=`rgba(${v},${v*0.85},${v*0.65},.10)`;
    g.fillRect(Math.random()*w, Math.random()*h, 1, rnd(2,5));
  }
},[2,2]);
const furBump = canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#808080'; g.fillRect(0,0,w,h);
  for(let i=0;i<14000;i++){
    const v=90+Math.random()*90;
    g.fillStyle=`rgba(${v},${v},${v},.5)`;
    g.fillRect(Math.random()*w, Math.random()*h, 1, 2+Math.random()*2);
  }
},[4,4]);
const furMat = new THREE.MeshStandardMaterial({ map:furMap, color:0xffffff, roughness:.92, bumpMap:furBump, bumpScale:.035 });
const furLight = new THREE.MeshStandardMaterial({ map:furMap, color:0xffe9c8, roughness:.9, bumpMap:furBump, bumpScale:.03 });
const pinkMat = new THREE.MeshStandardMaterial({ color:0xe79a9a, roughness:.8 });
const gloveMat = new THREE.MeshStandardMaterial({ color:0xffd9a8, roughness:.75 });
const visorMat = new THREE.MeshPhysicalMaterial({
  color:0xcdeeff, transparent:true, opacity:.38, roughness:.03, metalness:.05,
  transmission:.55, thickness:.25, ior:1.38, clearcoat:1, clearcoatRoughness:.04
});

const hamster = new THREE.Group();
const HAM_Y = -0.47;

/* --- torso: white suit over a round hamster body --- */
const torso = new THREE.Mesh(new THREE.CapsuleGeometry(.50,.50,10,20), suitMat);
torso.rotation.z = Math.PI/2; torso.position.set(0,2.24,0);
torso.castShadow=true; hamster.add(torso);

for(const dx of [-.30,.30]){
  const band = new THREE.Mesh(new THREE.TorusGeometry(.47,.06,10,28), accentMat);
  band.rotation.y = Math.PI/2; band.position.set(dx,2.30,0); hamster.add(band);
}
// collar
const collar = new THREE.Mesh(new THREE.TorusGeometry(.29,.06,10,28), accentMat);
collar.rotation.x = Math.PI/2; collar.position.set(0,2.72,.02); hamster.add(collar);

for(const sx of [-1,1]){

// eyes with shine

for(const sx of [-1,1]){

/* --- ears: big round, pink inside, poking through the helmet --- */
const ears=[];
for(const sx of [-1,1]){

/* --- helmet: glass dome in front of the face --- */
const helmet = new THREE.Mesh(new THREE.SphereGeometry(.50,36,26), visorMat);
helmet.position.set(0,3.04,.06); hamster.add(helmet);
const helmetRim = new THREE.Mesh(new THREE.TorusGeometry(.47,.05,10,36), suitMat);
helmetRim.rotation.x = Math.PI/2; helmetRim.position.set(0,2.70,.04); hamster.add(helmetRim);
const rimGlow = new THREE.Mesh(new THREE.TorusGeometry(.47,.015,8,36), new THREE.MeshBasicMaterial({color:0x6fe9ff}));

const glint = new THREE.Mesh(new THREE.SphereGeometry(.075,16,12),

const glint2 = new THREE.Mesh(new THREE.SphereGeometry(.032,12,8),

glint2.scale.set(1,.7,.3); glint2.position.set(-.26,3.16,.38); hamster.add(glint2);

/* --- limbs: short arms, sturdy legs, paws visible --- */
function makeLimb(parent, x,y,z, len, mat, thick){
  const pivot = new THREE.Group(); pivot.position.set(x,y,z);
  const cap = new THREE.Mesh(new THREE.CapsuleGeometry(thick, len, 6, 12), mat);
  cap.position.y = -len/2; cap.castShadow = true;
  pivot.add(cap); parent.add(pivot);
  return pivot;
}
const armL = makeLimb(hamster, -.48, 2.48, .12, .38, suitMat, .105);
const armR = makeLimb(hamster,  .48, 2.46, -.04, .38, suitMat, .105);
const legL = makeLimb(hamster, -.34, 1.78, .24, .72, suitMat, .145);
const legR = makeLimb(hamster,  .36, 1.78, -.18, .72, suitMat, .145);

// fur paws
for(const [pivot,sx] of [[armL,-1],[armR,1]]){
  const paw = new THREE.Mesh(new THREE.SphereGeometry(.11,14,12), furLight);
  paw.position.set(0,-.42,.02); paw.scale.set(1,.9,1.1); pivot.add(paw);
  for(let f=0;f<3;f++){
    const finger = new THREE.Mesh(new THREE.SphereGeometry(.032,8,6), furMat);
    finger.position.set((f-1)*.05,-.50,.05); pivot.add(finger);
  }
}
// boots with orange soles
for(const [pivot] of [[legL],[legR]]){
  const boot = new THREE.Mesh(new THREE.BoxGeometry(.32,.22,.46), suitMat);
  boot.position.set(0,-.72,.06); boot.castShadow=true; pivot.add(boot);
  const sole = new THREE.Mesh(new THREE.BoxGeometry(.33,.06,.48), new THREE.MeshStandardMaterial({color:0xff9b2f, roughness:.6}));

}

/* --- tail --- */
const tail = new THREE.Mesh(new THREE.TorusGeometry(.12,.035,8,20,Math.PI*1.2), furMat);
tail.position.set(0,2.02,-.50); tail.rotation.set(Math.PI/2,0,0.4); hamster.add(tail);

/* --- backpack --- */
const pack = new THREE.Mesh(new THREE.BoxGeometry(.46,.70,.26), new THREE.MeshStandardMaterial({color:0xdfe3e8, roughness:.6, roughnessMap:fabricRough}));
pack.position.set(0,2.26,-.50); pack.castShadow=true; hamster.add(pack);
const packGlow = new THREE.Mesh(new THREE.BoxGeometry(.30,.09,.03), glass);
packGlow.position.set(0,2.40,-.64); hamster.add(packGlow);

/* --------------------------------- wheel -------------------------------- */
const wheel = new THREE.Group();
const R = 2.05;
const frameMat = new THREE.MeshStandardMaterial({ color:0xd9dee6, metalness:.88, roughness:.34, roughnessMap:metalRough });
const glassMat = new THREE.MeshPhysicalMaterial({
  color:0xdff6ff, transparent:true, opacity:.20, roughness:.03, metalness:0,
  transmission:.95, thickness:.6, ior:1.45, side:THREE.DoubleSide
});
const energyMat = new THREE.MeshBasicMaterial({ color:0x4cf3ff });

const rimA = new THREE.Mesh(new THREE.TorusGeometry(R,.085,12,72), frameMat);
const rimB = new THREE.Mesh(new THREE.TorusGeometry(R-.35,.05,10,64), frameMat);
rimA.castShadow = rimB.castShadow = true;
wheel.add(rimA, rimB);
const shell = new THREE.Mesh(new THREE.CylinderGeometry(R-.02,R-.02,.55,64,1,true), glassMat);
shell.rotation.x = Math.PI/2; wheel.add(shell);
for(let i=0;i<10;i++){
  const a = i/10*Math.PI*2;
  const spoke = new THREE.Mesh(new THREE.CylinderGeometry(.028,.028,R-.36,8), frameMat);
  spoke.position.set(Math.cos(a)*(R-.18)/2, Math.sin(a)*(R-.18)/2, 0);
  spoke.rotation.z = a; wheel.add(spoke);
}
const hub = new THREE.Mesh(new THREE.CylinderGeometry(.20,.20,.62,20), frameMat);
hub.rotation.x = Math.PI/2; wheel.add(hub);
const hubGlow = new THREE.Mesh(new THREE.TorusGeometry(.22,.035,8,24), energyMat);
hubGlow.position.z=.31; wheel.add(hubGlow);
// energy lines on rim
for(let i=0;i<40;i++){
  const a=i/40*Math.PI*2;
  const dot=new THREE.Mesh(new THREE.SphereGeometry(.024,6,6), energyMat);
  dot.position.set(Math.cos(a)*(R+.03), Math.sin(a)*(R+.03), .30);
  wheel.add(dot);
}
// rim bolts
for(let i=0;i<24;i++){
  const a=i/24*Math.PI*2;
  const bolt=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.10,8), frameMat);
  bolt.rotation.x=Math.PI/2;
  bolt.position.set(Math.cos(a)*(R-.045), Math.sin(a)*(R-.045), .30);
  wheel.add(bolt);
}
// inner tread ring
const treadRing = new THREE.Mesh(new THREE.TorusGeometry(R-.20,.035,8,96), new THREE.MeshStandardMaterial({color:0x8b93a3, metalness:.6, roughness:.7}));
wheel.add(treadRing);
// semi-transparent motion disc to imply spin
const blurTex = canvasTex(512,512,(g,w,h)=>{
  g.translate(w/2,h/2);
  for(let i=0;i<54;i++){
    const a=i/54*Math.PI*2;
    g.strokeStyle='rgba(140,240,255,'+(0.05+Math.random()*0.10)+')';
    g.lineWidth=1+Math.random()*2;
    g.beginPath(); g.arc(0,0,w*0.30+Math.random()*40,a,a+0.22); g.stroke();
  }
});
const blur = new THREE.Mesh(new THREE.CircleGeometry(R-.1,64),
  new THREE.MeshBasicMaterial({ map:blurTex, transparent:true, opacity:.55, depthWrite:false, blending:THREE.AdditiveBlending }));
blur.position.z=.06; wheel.add(blur);

wheel.position.set(0,2.45,0);
scene.add(wheel);
// the hamster must NOT inherit the wheel's spin
hamster.position.set(0,HAM_Y,0);
hamster.rotation.set(0.05, 1.35, 0);
scene.add(hamster);

/* ------------------------------- vehicle -------------------------------- */
const chassis = new THREE.Group();
const bodyMat = new THREE.MeshStandardMaterial({ color:0xeef1f5, roughness:.35, metalness:.25 });
const orangeMat = new THREE.MeshStandardMaterial({ color:0xffa32e, emissive:0xff7a00, emissiveIntensity:.08, roughness:.45 });

const hull = new THREE.Mesh(new THREE.BoxGeometry(2.6,.65,3.4), bodyMat);
hull.position.y=.62; hull.castShadow=hull.receiveShadow=true; chassis.add(hull);
const hullTop = new THREE.Mesh(new THREE.BoxGeometry(2.2,.35,2.6), bodyMat);
hullTop.position.set(0,.98,-.1); hullTop.castShadow=true; chassis.add(hullTop);
for(const z of [-1.5,1.45]){
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(2.62,.14,.5), orangeMat);
  stripe.position.set(0,.62,z); chassis.add(stripe);
}
// side treads
for(const sx of [-1,1]){
  const tread = new THREE.Mesh(new THREE.BoxGeometry(.38,.5,3.2), dark);
  tread.position.set(sx*1.35,.45,0); tread.castShadow=true; chassis.add(tread);
  for(let i=0;i<5;i++){
    const w = new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,.4,14), dark);
    w.rotation.z=Math.PI/2; w.position.set(sx*1.35,.30,-1.2+i*.6); chassis.add(w);
  }
}
// wheel support fork
for(const sx of [-.62,.62]){
  const fork = new THREE.Mesh(new THREE.BoxGeometry(.24,1.55,.26), frameMat);
  fork.position.set(sx,1.82,.0); fork.castShadow=true; chassis.add(fork);
  const axle = new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.5,14), frameMat);
  axle.rotation.z=Math.PI/2; axle.position.set(sx*.62,2.45,0); chassis.add(axle);
}
// cross brace
const brace = new THREE.Mesh(new THREE.BoxGeometry(1.3,.14,.18), frameMat);
brace.position.set(0,1.55,-0.55); brace.castShadow=true; chassis.add(brace);
// vacuum nozzle at the front
const nozzle = new THREE.Group();
const tube = new THREE.Mesh(new THREE.CylinderGeometry(.16,.22,1.25,18), new THREE.MeshStandardMaterial({color:0x444a56, metalness:.5, roughness:.4}));
tube.rotation.x = 1.30; tube.position.set(0,.42,1.85); nozzle.add(tube);
const mouth = new THREE.Mesh(new THREE.CylinderGeometry(.42,.28,.5,20,1,true), new THREE.MeshStandardMaterial({color:0x2f333c, metalness:.6, roughness:.35, side:THREE.DoubleSide}));
mouth.rotation.x = 1.20; mouth.position.set(0,.17,2.30); nozzle.add(mouth);
const mouthGlow = new THREE.Mesh(new THREE.TorusGeometry(.34,.03,8,28), energyMat);
mouthGlow.rotation.x = 1.20; mouthGlow.position.set(0,.20,2.32); nozzle.add(mouthGlow);
const brush = new THREE.Mesh(new THREE.TorusGeometry(.40,.05,8,28), new THREE.MeshStandardMaterial({color:0xc9c2b2, roughness:1}));
brush.rotation.x = Math.PI/2; brush.position.set(0,.06,2.34); nozzle.add(brush);
chassis.add(nozzle);

// hose from vacuum to wheel
const curve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(.2,.85,1.75), new THREE.Vector3(.75,1.35,1.1),
  new THREE.Vector3(.62,1.9,.45), new THREE.Vector3(.3,2.2,.1)
]);
const hose = new THREE.Mesh(new THREE.TubeGeometry(curve,40,.07,10,false), new THREE.MeshStandardMaterial({color:0x333842, roughness:.6, metalness:.35}));
hose.castShadow=true; chassis.add(hose);

// antenna + flag
const ant = new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,1.1,6), dark);
ant.position.set(-1.05,1.6,-1.3); chassis.add(ant);
const flag = new THREE.Mesh(new THREE.PlaneGeometry(.42,.26), new THREE.MeshStandardMaterial({color:0xffa32e, side:THREE.DoubleSide, emissive:0xff7a00, emissiveIntensity:.15}));
flag.position.set(-.83,2.05,-1.3); chassis.add(flag);

chassis.position.set(0,0,0);
scene.add(chassis);
const innerShadow = new THREE.Mesh(new THREE.CircleGeometry(1.15,32),
  new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:.30, depthWrite:false }));
innerShadow.rotation.x=-Math.PI/2; innerShadow.position.set(0,.42,0); scene.add(innerShadow);

const contact = new THREE.Mesh(new THREE.CircleGeometry(2.4,48),
  new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:.34, depthWrite:false }));
contact.rotation.x=-Math.PI/2; contact.position.set(0,.02,.2); contact.scale.set(1,1.35,1); scene.add(contact);

/* -------------------------------- dust ---------------------------------- */
const dustTex = canvasTex(64,64,(g,w,h)=>{
  const grd=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  grd.addColorStop(0,'rgba(255,255,255,1)');
  grd.addColorStop(.35,'rgba(230,240,255,.65)');
  grd.addColorStop(1,'rgba(180,220,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,w,h);
});
const DN = 420;
const dGeo = new THREE.BufferGeometry();
const dPos = new Float32Array(DN*3), dSeed = new Float32Array(DN);
for(let i=0;i<DN;i++){
  const t = Math.random();
  const angle = rnd(0,Math.PI*2), rad = rnd(.5,4.5);
  dPos[i*3] = Math.cos(angle)*rad*.8;
  dPos[i*3+1] = rnd(.1,2.6);
  dPos[i*3+2] = 1.4 + Math.sin(angle)*rad*.5 + t*1.6;
  dSeed[i] = Math.random()*10;
}
dGeo.setAttribute('position', new THREE.BufferAttribute(dPos,3));
const dMat = new THREE.PointsMaterial({ map:dustTex, size:.14, transparent:true, opacity:.55,
  depthWrite:false, blending:THREE.AdditiveBlending, color:0xdfeaff });
const dust = new THREE.Points(dGeo, dMat);
scene.add(dust);

// a few larger glints catching sunlight
const glintGeo = new THREE.BufferGeometry();
const gp = new Float32Array(90*3);
for(let i=0;i<90;i++){ gp[i*3]=rnd(-6,6); gp[i*3+1]=rnd(.1,3); gp[i*3+2]=rnd(-4,5); }
glintGeo.setAttribute('position', new THREE.BufferAttribute(gp,3));
const glints = new THREE.Points(glintGeo, new THREE.PointsMaterial({ map:dustTex, size:.26, color:0xffffff, transparent:true, opacity:.40, depthWrite:false, blending:THREE.AdditiveBlending }));
scene.add(glints);

/* --------------------------------- views -------------------------------- */
const views = {
  hero:   { pos:[6.5,4.0,13.0], look:[0,2.2,-4], fov:46 },
  close:  { pos:[3.4,2.5,5.2],  look:[0,2.0,0], fov:30 },
  wide:   { pos:[15,8.5,24],    look:[0,2.0,-14], fov:55 },
};
const v = views[VIEW] || views.hero;
camera.fov = v.fov;
camera.position.set(...v.pos);
camera.lookAt(new THREE.Vector3(...v.look));
camera.updateProjectionMatrix();

/* -------------------------------- animate ------------------------------- */
let t0 = performance.now();
const STILL = params.get('still') === '1';
const POSE = Number(params.get('pose') || 1.15);
let phase = STILL ? POSE : 0, blinkAt = 2.5;
const CAD = 7.2;          // stride cadence (rad/s)
const GEAR = 0.62;        // wheel turns per stride unit

function tick(now){
  const dt = Math.min(0.05, (now - t0)/1000);
  t0 = now;
  if (!STILL) phase += dt * CAD;

  // rotor follows the stride
  wheel.rotation.z = -phase * GEAR;
  blur.rotation.z = -phase * GEAR * 0.55;
  blur.material.opacity = 0.35 + 0.25*Math.abs(Math.sin(phase*0.5));

  // run cycle: diagonal pairs, body bob, arm counter-swing
  const s1 = Math.sin(phase), s2 = Math.sin(phase + Math.PI);
  legL.rotation.z = 0.10 + s1*0.95;
  legR.rotation.z = -0.10 + s2*0.95;
  armL.rotation.z = 0.16 + s2*0.65;
  armR.rotation.z = -0.16 + s1*0.65;
  legL.rotation.x = 0; legR.rotation.x = 0;
  armL.rotation.x = 0; armR.rotation.x = 0;

  hamster.position.y = HAM_Y + Math.abs(Math.sin(phase))*0.055;
  hamster.rotation.x = 0.10 + Math.sin(phase*2)*0.025;
  hamster.rotation.z = Math.sin(phase)*0.02;
  ears[0].rotation.z = 0.10 + s1*0.10;
  ears[1].rotation.z = -0.10 - s2*0.10;
  tail.rotation.x = Math.sin(phase)*0.25;
  const jig = 1 + Math.abs(Math.sin(phase))*0.015;
  hamster.scale.set(jig, 1/jig, jig);

  // blink every ~3 s
  if (now/1000 > blinkAt){ blinkAt = now/1000 + 2.6 + Math.random()*2.4; }
  const blinking = !STILL && (blinkAt - now/1000) > 2.45;
  for(const e of eyes) e.scale.y = blinking ? 0.18 : 1;

  // dust drift into the nozzle
  const arr = dGeo.attributes.position.array;
  for(let i=0;i<DN;i++){
    const s = dSeed[i];
    arr[i*3+1] += Math.sin(now*0.0014+s)*0.0012;
    arr[i*3+2] -= 0.004 + (s%3)*0.001;
    if(arr[i*3+2] < 1.2){ arr[i*3+2] = 6.5; arr[i*3] = rnd(-3.4,3.4); arr[i*3+1] = rnd(.1,2.8); }
  }
  dGeo.attributes.position.needsUpdate = true;
  stars.rotation.y += dt*0.004;
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* --------------------------------- ready -------------------------------- */
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
setTimeout(()=>{ const l=document.getElementById('loading'); l.style.opacity=0; setTimeout(()=>l.remove(),450); }, 120);
window.__ready = true;
</script>
